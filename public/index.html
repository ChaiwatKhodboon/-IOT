<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="ระบบยืมคืนอุปกรณ์ IoT">
  <title>ระบบยืมคืนอุปกรณ์ IoT</title>
  <link rel="manifest" href="/manifest.webmanifest?v=7">
  <link rel="icon" type="image/jpeg" href="/icons/IT.jpg">
  <link rel="apple-touch-icon" href="/icons/IT.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=borrower-avatar-v1">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <section id="loginView" class="auth-screen">
    <div class="auth-top"><p>สาขาเทคโนโลยีสารสนเทศ</p><strong>ระบบยืม-คืน อุปกรณ์ IoT</strong></div>
    <div class="auth-content">
      <img class="auth-logo" src="/icons/IT.jpg" alt="IoT Loan">
      <h1>เข้าสู่ระบบ</h1>
      <form id="loginForm" class="auth-card" autocomplete="off">
        <p class="overline">STAFF SIGN IN</p><h2>ลงชื่อเข้าใช้ระบบ</h2>
        <label>ชื่อผู้ใช้<input name="username" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="กรอกชื่อผู้ใช้" required></label>
        <label>รหัสผ่าน<div class="password-field"><input name="password" type="password" autocomplete="new-password" placeholder="••••••••" required><button class="password-toggle" type="button" onclick="togglePassword(this)" aria-label="แสดงรหัสผ่าน" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></label>
        <div class="forgot-row"><button type="button" onclick="forgotPassword()">ลืมรหัสผ่าน?</button></div>
        <button class="button primary wide">เข้าสู่ระบบ</button>
      </form>
      <button id="showSignup" class="auth-link" type="button">สมัครสมาชิกสำหรับผู้ใช้งาน</button>
    </div>
  </section>
  <section id="signupView" class="auth-screen hidden">
    <div class="auth-top"><p>สาขาเทคโนโลยีสารสนเทศ</p><strong>ระบบยืม-คืน อุปกรณ์ IoT</strong></div>
    <div class="auth-content">
      <img class="auth-logo" src="/icons/IT.jpg" alt="IoT Loan">
      <h1>สมัครสมาชิก</h1>
      <form id="signupForm" class="auth-card">
        <h2>ลงทะเบียนผู้ใช้ใหม่</h2><p class="form-hint">สำหรับผู้ใช้ที่ยังไม่มีบัญชีเข้าใช้งาน</p>
        <label>ชื่อ-นามสกุล<input name="fullName" autocomplete="name" placeholder="กรอกชื่อ-นามสกุล" required></label>
        <label>ชื่อผู้ใช้หรืออีเมล<input name="username" autocomplete="username" placeholder="เช่น somchai.k@ku.th" required></label>
        <label>รหัสนิสิต<input name="studentId" inputmode="numeric" placeholder="กรอกรหัสนิสิต (ถ้ามี)"></label>
        <label>ตั้งรหัสผ่าน<div class="password-field"><input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required><button class="password-toggle" type="button" onclick="togglePassword(this)" aria-label="แสดงรหัสผ่าน" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></label>
        <label>ยืนยันรหัสผ่าน<div class="password-field"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="กรอกรหัสผ่านอีกครั้ง" required><button class="password-toggle" type="button" onclick="togglePassword(this)" aria-label="แสดงรหัสผ่าน" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></label>
        <button class="button primary wide">ลงทะเบียน</button>
      </form>
      <button id="showLogin" class="auth-link" type="button">มีบัญชีอยู่แล้ว / กลับเข้าสู่ระบบ</button>
    </div>
  </section>
  <div id="appView" class="app hidden">
    <header class="app-header"><img src="/icons/IT.jpg" alt=""><strong>ระบบยืม-คืน อุปกรณ์ IoT</strong><button id="installBtn" class="install hidden">ติดตั้ง</button></header>
    <main id="content"></main><nav id="bottomNav" class="bottom-nav"></nav>
  </div>
  <dialog id="modal"><div class="modal-sheet"><button class="close" onclick="modal.close()">×</button><div id="modalBody"></div></div></dialog>
  <script src="/bootstrap.js?v=borrower-avatar-v1"></script>
</body>
</html>
